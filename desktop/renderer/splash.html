<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FasoBar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 20% 0%, #ecfdf5, #f8fafc 55%);
        color: #0f172a;
      }
      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: linear-gradient(145deg, #10b981, #047857);
        display: grid;
        place-items: center;
        color: white;
        font-weight: 700;
        font-size: 18px;
        box-shadow: 0 12px 30px -12px rgba(4, 120, 87, 0.7);
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      h1 span {
        color: #059669;
      }
      p {
        margin: 10px 0 0;
        color: #64748b;
        font-size: 14px;
      }
      .bar {
        margin: 28px auto 0;
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        background: #059669;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="mark">FB</div>
        <h1>Faso<span>Bar</span></h1>
        <p>Démarrage en cours…</p>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuration FasoBar</title>
    <style>
      :root {
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(900px 420px at 10% -10%, #d1fae5 0%, transparent 60%),
          linear-gradient(180deg, #f8fafc, #eef2f7);
        color: #0f172a;
      }
      .shell {
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 20px 28px;
      }
      .brand {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .brand span {
        color: #059669;
      }
      .eyebrow {
        margin: 18px 0 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #047857;
      }
      h1 {
        margin: 8px 0 0;
        font-size: clamp(22px, 3vw, 30px);
        letter-spacing: -0.03em;
        line-height: 1.2;
      }
      .lead {
        margin: 10px 0 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.5;
        max-width: 52ch;
      }
      .choices {
        margin-top: 28px;
        display: grid;
        gap: 12px;
      }
      .choice {
        text-align: left;
        border: 1px solid #e2e8f0;
        background: #fff;
        border-radius: 14px;
        padding: 16px 18px;
        cursor: pointer;
      }
      .choice:hover {
        border-color: #34d399;
      }
      .choice strong {
        display: block;
        font-size: 15px;
      }
      .choice span {
        display: block;
        margin-top: 6px;
        color: #64748b;
        font-size: 13px;
        line-height: 1.45;
      }
      .poste {
        margin-top: 22px;
        padding: 16px;
        border-radius: 14px;
        border: 1px solid #e2e8f0;
        background: #fff;
      }
      .poste[hidden],
      .alert[hidden],
      .choices[hidden] {
        display: none !important;
      }
      .poste label {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }
      .poste input {
        margin-top: 8px;
        width: 100%;
        height: 42px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        padding: 0 12px;
        font-size: 14px;
      }
      .actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }
      .primary {
        height: 40px;
        border: 0;
        border-radius: 10px;
        padding: 0 16px;
        background: #0f172a;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .ghost {
        height: 40px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        background: #fff;
        padding: 0 14px;
        cursor: pointer;
      }
      .link {
        border: 0;
        background: transparent;
        color: #64748b;
        font-size: 12px;
        cursor: pointer;
        text-decoration: underline;
      }
      footer {
        margin-top: 28px;
      }
      .alert {
        margin-top: 16px;
        border-radius: 10px;
        border: 1px solid #fecaca;
        background: #fef2f2;
        color: #991b1b;
        padding: 10px 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="brand">Faso<span>Bar</span></div>
        <p class="eyebrow">Installation Windows</p>
        <h1>Comment FasoBar sera-t-il utilisé sur cet ordinateur&nbsp;?</h1>
        <p class="lead">
          Choisissez le rôle de ce PC. Un seul serveur FasoBar par établissement
          (PC Caisse).
        </p>
      </header>

      <div id="alert" class="alert" hidden></div>

      <div class="choices" id="choices">
        <button type="button" class="choice" data-mode="SERVEUR_CAISSE">
          <strong>Serveur principal + Poste Caisse</strong>
          <span
            >Démarre le serveur local, ouvre la Caisse, et partage FasoBar sur le
            réseau.</span
          >
        </button>
        <button type="button" class="choice" data-mode="POSTE_TRAVAIL">
          <strong>Poste de travail</strong>
          <span
            >Se connecte au PC Caisse. N’héberge aucune base ni serveur
            local.</span
          >
        </button>
      </div>

      <section id="poste-form" class="poste" hidden>
        <label for="serverUrl">Adresse du PC Caisse</label>
        <input
          id="serverUrl"
          type="text"
          placeholder="http://192.168.1.10:3180"
          autocomplete="off"
        />
        <div class="actions">
          <button type="button" id="backBtn" class="ghost">Retour</button>
          <button type="button" id="connectBtn" class="primary">
            Se connecter
          </button>
        </div>
      </section>

      <footer>
        <button type="button" id="techBtn" class="link">
          Informations techniques
        </button>
      </footer>
    </div>
    <script>
      const api = window.fasobarDesktop;
      const alertEl = document.getElementById("alert");
      const choices = document.getElementById("choices");
      const posteForm = document.getElementById("poste-form");
      const serverUrlInput = document.getElementById("serverUrl");
      const connectBtn = document.getElementById("connectBtn");

      function showError(message) {
        alertEl.hidden = false;
        alertEl.textContent = message;
      }
      function clearError() {
        alertEl.hidden = true;
        alertEl.textContent = "";
      }

      async function complete(mode, serverUrl) {
        clearError();
        connectBtn.disabled = true;
        try {
          const result = await api.completeSetup({ mode, serverUrl });
          if (!result.ok) showError(result.error || "Configuration impossible.");
        } catch (error) {
          showError(error && error.message ? error.message : "Erreur inattendue.");
        } finally {
          connectBtn.disabled = false;
        }
      }

      choices.querySelectorAll(".choice").forEach((button) => {
        button.addEventListener("click", () => {
          const mode = button.getAttribute("data-mode");
          clearError();
          if (mode === "SERVEUR_CAISSE") {
            complete("SERVEUR_CAISSE");
            return;
          }
          choices.hidden = true;
          posteForm.hidden = false;
        });
      });

      document.getElementById("backBtn").addEventListener("click", () => {
        posteForm.hidden = true;
        choices.hidden = false;
        clearError();
      });

      connectBtn.addEventListener("click", () => {
        complete("POSTE_TRAVAIL", serverUrlInput.value);
      });

      document.getElementById("techBtn").addEventListener("click", () => {
        api.showTechInfo();
      });
    </script>
  </body>
</html>
